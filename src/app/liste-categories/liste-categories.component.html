<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Id</th>
            <th>Nom Catégorie</th>
          </tr>
        </thead>
        @for (cat of categories; track cat.idCat) {
          <tbody>
            <tr>
              <td>{{ cat.idCat }}</td>
              <td>{{ cat.nomCat }}</td>
            </tr>
          </tbody>
        }
      </table>
    </div>
  </div>
</div>
